name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build RailFlow.slnx -c Release

      - name: Test
        run: dotnet test RailFlow.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t railflow:ci .

      - name: Start container and check /healthz
        run: |
          docker run -d --name railflow -p 8080:8080 railflow:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/healthz; then echo; exit 0; fi
            sleep 1
          done
          docker logs railflow
          exit 1
